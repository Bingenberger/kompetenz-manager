{% extends "base.html" %}
{% from "includes/icons.html" import bi %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Schülerdaten bearbeiten</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {{ csrf_input() }}
                    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
                    <div class="mb-3">
                        <label class="form-label">Vorname</label>
                        <input type="text" name="vorname" class="form-control" value="{{ s.vorname }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nachname</label>
                        <input type="text" name="nachname" class="form-control" value="{{ s.nachname }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Klasse</label>
                        <input type="text" name="klasse" class="form-control" value="{{ s.klasse }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Geburtsdatum</label>
                        <input
                            type="date"
                            name="geburtsdatum"
                            class="form-control"
                            value="{{ s.geburtsdatum.strftime('%Y-%m-%d') if s.geburtsdatum else '' }}">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success icon-btn justify-content-center">{{ bi('floppy', 'bi-icon') }} <span>Speichern</span></button>
                        <a href="{{ next_url if next_url else url_for('admin.admin_students') }}" class="btn btn-outline-secondary icon-btn justify-content-center">{{ bi('x-circle', 'bi-icon') }} <span>Abbrechen</span></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

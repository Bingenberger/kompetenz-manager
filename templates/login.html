<!doctype html>
<html lang="de">
    {% from "includes/icons.html" import bi %}
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Kompetenz-App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --c-red: #f94144;
            --c-orange: #f3722c;
            --c-sun: #f9c74f;
            --c-green: #90be6d;
            --c-seagrass: #43aa8b;
            --c-cyan: #4d908e;
            --c-slate: #577590;
            --c-cerulean: #277da1;
            --ink-900: #1f2933;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(249,65,68,0.18), transparent 36%),
                radial-gradient(circle at 90% 15%, rgba(249,199,79,0.22), transparent 38%),
                radial-gradient(circle at 80% 90%, rgba(67,170,139,0.18), transparent 35%),
                linear-gradient(145deg, #edf6fb, #f9fcff);
            color: var(--ink-900);
        }
        .card {
            border: 1px solid rgba(87,117,144,0.18);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(39,125,161,0.16);
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(3px);
        }
        .btn-primary {
            background: linear-gradient(90deg, var(--c-cerulean), var(--c-cyan));
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #216988, #3f7a79);
        }
        .bi { width: 1em; height: 1em; display: inline-block; vertical-align: -.125em; }
        .bi-icon-xl { width: 2rem; height: 2rem; }
        .alert-danger {
            background-color: rgba(249,65,68,0.1);
            border-color: rgba(249,65,68,0.25);
            color: #8d1f2a;
        }
        .form-control:focus {
            border-color: rgba(39,125,161,0.45);
            box-shadow: 0 0 0 .2rem rgba(39,125,161,0.15);
        }
    </style>
  </head>
  <body>
    <div class="card p-5 text-center" style="width: 100%; max-width: 430px;">
        <div class="mb-3 d-inline-flex justify-content-center" style="font-size:2rem; color:#277da1;">{{ bi('building', 'bi-icon-xl') }}</div>
        <h1 class="mb-1" style="font-weight:800;">Kompetenz-App</h1>
        <p class="text-muted mb-4">Anmeldung</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST">

            {{ csrf_input() }}
            <div class="mb-3 text-start">
                <label class="form-label text-muted">Benutzername</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-muted">Passwort</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Anmelden</button>
        </form>
        <div class="mt-4 small" style="color:#577590;">Schul-Kompetenz-App v1.0</div>
    </div>
  </body>
</html>
